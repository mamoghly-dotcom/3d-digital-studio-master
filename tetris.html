<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mustafa'nın Tetris Oyunu</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #1e2130, #0a0b10 70%);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #eee;
  }
  .wrap {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    padding: 20px;
  }
  .board-panel {
    background: #12141c;
    padding: 10px;
    border-radius: 8px;
    box-shadow: 0 0 0 2px #2a2e42, 0 10px 30px rgba(0,0,0,0.6);
  }
  canvas#board {
    display: block;
    background: #06070b;
    border-radius: 4px;
  }
  .side {
    width: 190px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .panel {
    background: #12141c;
    border-radius: 8px;
    padding: 12px 14px;
    box-shadow: 0 0 0 2px #2a2e42;
  }
  .panel h3 {
    margin: 0 0 8px;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #8a8fb8;
  }
  .player {
    font-size: 18px;
    font-weight: bold;
    color: #ffcc4d;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin: 4px 0;
  }
  .stat-row span:last-child { font-weight: bold; color: #6dd3ff; }
  canvas#next {
    display: block;
    margin: 0 auto;
    background: #06070b;
    border-radius: 4px;
  }
  .controls {
    font-size: 12.5px;
    line-height: 1.7;
    color: #b6bad8;
  }
  .controls b { color: #eee; }
  .bomb-note {
    font-size: 12.5px;
    color: #ff8a8a;
    line-height: 1.5;
  }
  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: #3457d5;
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: .5px;
  }
  button:hover { background: #4568e8; }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(6,7,11,0.86);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    border-radius: 4px;
    text-align: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; color: #ffcc4d; }
  .board-holder { position: relative; }
  .flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="board-panel">
      <div class="board-holder">
        <canvas id="board" width="300" height="600"></canvas>
        <div class="flash" id="flash"></div>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Oyun Bitti</h2>
          <div id="overlayScore"></div>
          <button id="restartBtn">Yeniden Başla</button>
        </div>
      </div>
    </div>
    <div class="side">
      <div class="panel">
        <h3>Oyuncu</h3>
        <div class="player">Mustafa</div>
      </div>
      <div class="panel">
        <h3>Sonraki</h3>
        <canvas id="next" width="100" height="100"></canvas>
      </div>
      <div class="panel">
        <div class="stat-row"><span>Skor</span><span id="score">0</span></div>
        <div class="stat-row"><span>Seviye</span><span id="level">1</span></div>
        <div class="stat-row"><span>Satır</span><span id="lines">0</span></div>
      </div>
      <div class="panel">
        <h3>Kontroller</h3>
        <div class="controls">
          <b>← →</b> hareket<br>
          <b>↑</b> döndür<br>
          <b>↓</b> yumuşak düşür<br>
          <b>Boşluk</b> sert düşür<br>
          <b>P</b> duraklat
        </div>
      </div>
      <div class="panel">
        <h3>💣 Bomba</h3>
        <div class="bomb-note">Arada bir bomba parçası düşer. Yere değince tüm tahtayı temizler!</div>
      </div>
      <button id="pauseBtn">Duraklat</button>
    </div>
  </div>

<script>
(function () {
  const COLS = 10, ROWS = 20, CELL = 30;
  const boardCanvas = document.getElementById('board');
  const ctx = boardCanvas.getContext('2d');
  const nextCanvas = document.getElementById('next');
  const nctx = nextCanvas.getContext('2d');
  const flashEl = document.getElementById('flash');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayScore = document.getElementById('overlayScore');
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const linesEl = document.getElementById('lines');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartBtn = document.getElementById('restartBtn');

  const COLORS = {
    I: '#4dd9ff', O: '#ffd93d', T: '#c77dff',
    S: '#6dff8f', Z: '#ff6b6b', J: '#5c7cff', L: '#ffa64d',
    BOMB: '#ff2e2e'
  };

  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]],
    BOMB: [[0,0]]
  };
  const PIECE_TYPES = ['I','O','T','S','Z','J','L'];
  const BOMB_CHANCE = 0.08;

  let board, current, next, score, level, lines, dropInterval, dropTimer;
  let paused, gameOver, lastTime, rafId;

  function emptyBoard() {
    return Array.from({length: ROWS}, () => Array(COLS).fill(null));
  }

  function randomType() {
    if (Math.random() < BOMB_CHANCE) return 'BOMB';
    return PIECE_TYPES[Math.floor(Math.random() * PIECE_TYPES.length)];
  }

  function makePiece(type) {
    return {
      type,
      cells: SHAPES[type].map(([x,y]) => ({x, y})),
      x: type === 'BOMB' ? Math.floor(COLS/2) : Math.floor(COLS/2) - 1,
      y: 0
    };
  }

  // rotate 90deg CW within the piece's bounding-box square
  function rotatedCells(piece) {
    if (piece.type === 'O' || piece.type === 'BOMB') return piece.cells.map(c => ({...c}));
    const xs = piece.cells.map(c => c.x), ys = piece.cells.map(c => c.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const size = Math.max(maxX - minX, maxY - minY) + 1;
    return piece.cells.map(({x,y}) => {
      const lx = x - minX, ly = y - minY;
      const nx = ly;
      const ny = size - 1 - lx;
      return { x: nx + minX, y: ny + minY };
    });
  }

  function collides(cells, ox, oy) {
    for (const c of cells) {
      const x = c.x + ox, y = c.y + oy;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && board[y][x]) return true;
    }
    return false;
  }

  function resetState() {
    board = emptyBoard();
    score = 0; level = 1; lines = 0;
    dropInterval = 800;
    current = makePiece(randomType());
    next = makePiece(randomType());
    paused = false; gameOver = false;
    updateStats();
    overlay.classList.remove('show');
  }

  function updateStats() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    linesEl.textContent = lines;
  }

  function lockPiece() {
    if (current.type === 'BOMB') {
      triggerBomb();
      return;
    }
    for (const c of current.cells) {
      const x = current.x + c.x, y = current.y + c.y;
      if (y >= 0) board[y][x] = current.type;
    }
    clearLines();
    spawnNext();
  }

  function triggerBomb() {
    flashEl.style.transition = 'none';
    flashEl.style.opacity = '0.9';
    requestAnimationFrame(() => {
      flashEl.style.transition = 'opacity 400ms ease';
      flashEl.style.opacity = '0';
    });
    board = emptyBoard();
    score += 200;
    updateStats();
    spawnNext();
  }

  function clearLines() {
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (board[y].every(cell => cell)) {
        board.splice(y, 1);
        board.unshift(Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if (cleared > 0) {
      const points = [0, 100, 300, 500, 800][cleared] || cleared * 250;
      score += points * level;
      lines += cleared;
      level = 1 + Math.floor(lines / 10);
      dropInterval = Math.max(120, 800 - (level - 1) * 70);
      updateStats();
    }
  }

  function spawnNext() {
    current = next;
    current.x = current.type === 'BOMB' ? Math.floor(COLS/2) : Math.floor(COLS/2) - 1;
    current.y = 0;
    next = makePiece(randomType());
    if (collides(current.cells, current.x, current.y)) {
      endGame();
    }
  }

  function endGame() {
    gameOver = true;
    overlayTitle.textContent = 'Oyun Bitti';
    overlayScore.textContent = 'Mustafa, skorun: ' + score;
    overlay.classList.add('show');
  }

  function move(dx) {
    if (!collides(current.cells, current.x + dx, current.y)) {
      current.x += dx;
    }
  }

  function softDrop() {
    if (!collides(current.cells, current.x, current.y + 1)) {
      current.y += 1;
      score += 1;
      updateStats();
    } else {
      lockPiece();
    }
    dropTimer = 0;
  }

  function hardDrop() {
    let dist = 0;
    while (!collides(current.cells, current.x, current.y + 1)) {
      current.y += 1;
      dist++;
    }
    score += dist * 2;
    updateStats();
    lockPiece();
    dropTimer = 0;
  }

  function rotate() {
    const rotated = rotatedCells(current);
    if (!collides(rotated, current.x, current.y)) {
      current.cells = rotated;
    } else if (!collides(rotated, current.x - 1, current.y)) {
      current.x -= 1; current.cells = rotated;
    } else if (!collides(rotated, current.x + 1, current.y)) {
      current.x += 1; current.cells = rotated;
    }
  }

  function drawCell(c, x, y, color, size, offctx) {
    offctx.fillStyle = color;
    offctx.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
    offctx.strokeStyle = 'rgba(255,255,255,0.15)';
    offctx.strokeRect(x * size + 1, y * size + 1, size - 2, size - 2);
  }

  function draw() {
    ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
    // grid background
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x*CELL, 0); ctx.lineTo(x*CELL, ROWS*CELL); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y*CELL); ctx.lineTo(COLS*CELL, y*CELL); ctx.stroke();
    }
    // locked cells
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (board[y][x]) drawCell(null, x, y, COLORS[board[y][x]], CELL, ctx);
      }
    }
    // ghost piece
    let ghostY = current.y;
    while (!collides(current.cells, current.x, ghostY + 1)) ghostY++;
    ctx.save();
    ctx.globalAlpha = 0.18;
    for (const c of current.cells) {
      const x = current.x + c.x, y = ghostY + c.y;
      if (y >= 0) drawCell(null, x, y, COLORS[current.type], CELL, ctx);
    }
    ctx.restore();
    // current piece
    for (const c of current.cells) {
      const x = current.x + c.x, y = current.y + c.y;
      if (y >= 0) drawCell(null, x, y, COLORS[current.type], CELL, ctx);
      if (current.type === 'BOMB' && y >= 0) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('💣', x*CELL + CELL/2, y*CELL + CELL/2 + 6);
      }
    }
    // next preview
    nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    const size = 22;
    const cells = next.cells;
    const xs = cells.map(c=>c.x), ys = cells.map(c=>c.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const w = (maxX - minX + 1) * size, h = (maxY - minY + 1) * size;
    const offX = (nextCanvas.width - w) / 2, offY = (nextCanvas.height - h) / 2;
    for (const c of cells) {
      const x = (c.x - minX) * size + offX;
      const y = (c.y - minY) * size + offY;
      nctx.fillStyle = COLORS[next.type];
      nctx.fillRect(x + 1, y + 1, size - 2, size - 2);
      nctx.strokeStyle = 'rgba(255,255,255,0.15)';
      nctx.strokeRect(x + 1, y + 1, size - 2, size - 2);
      if (next.type === 'BOMB') {
        nctx.fillStyle = '#fff';
        nctx.font = 'bold 14px Arial';
        nctx.textAlign = 'center';
        nctx.fillText('💣', x + size/2, y + size/2 + 5);
      }
    }
  }

  function loop(time) {
    if (!lastTime) lastTime = time;
    const delta = time - lastTime;
    lastTime = time;
    if (!paused && !gameOver) {
      dropTimer = (dropTimer || 0) + delta;
      if (dropTimer > dropInterval) {
        if (!collides(current.cells, current.x, current.y + 1)) {
          current.y += 1;
        } else {
          lockPiece();
        }
        dropTimer = 0;
      }
      draw();
    }
    rafId = requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', (e) => {
    if (gameOver) return;
    if (e.code === 'KeyP') { togglePause(); return; }
    if (paused) return;
    switch (e.code) {
      case 'ArrowLeft': move(-1); e.preventDefault(); break;
      case 'ArrowRight': move(1); e.preventDefault(); break;
      case 'ArrowUp': rotate(); e.preventDefault(); break;
      case 'ArrowDown': softDrop(); e.preventDefault(); break;
      case 'Space': hardDrop(); e.preventDefault(); break;
    }
  });

  function togglePause() {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Devam Et' : 'Duraklat';
  }

  pauseBtn.addEventListener('click', togglePause);
  restartBtn.addEventListener('click', () => {
    resetState();
  });

  resetState();
  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
